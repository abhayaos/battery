
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Battery Monitor</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #101010;
    font-family: Arial, sans-serif;
    color: white;
}

.container {
    width: 320px;
    padding: 30px;
    text-align: center;
    background: #1b1b1b;
    border-radius: 25px;
}

h2 {
    margin-bottom: 30px;
    font-size: 22px;
}

.battery {
    width: 130px;
    height: 65px;
    border: 4px solid #fff;
    border-radius: 10px;
    margin: auto;
    position: relative;
    padding: 4px;
}

.battery::after {
    content: "";
    position: absolute;
    right: -11px;
    top: 17px;
    width: 7px;
    height: 25px;
    background: white;
    border-radius: 0 4px 4px 0;
}

.level {
    height: 100%;
    width: 50%;
    background: #4ade80;
    border-radius: 4px;
    transition: width 0.5s;
}

.percentage {
    font-size: 48px;
    font-weight: bold;
    margin-top: 25px;
}

.status {
    color: #aaa;
    margin-top: 12px;
    font-size: 15px;
}

.info {
    margin-top: 25px;
    padding: 15px;
    background: #292929;
    border-radius: 12px;
    line-height: 2;
}
</style>
</head>

<body>

<div class="container">
    <h2>Mobile Battery</h2>

    <div class="battery">
        <div class="level" id="level"></div>
    </div>

    <div class="percentage" id="percentage">--%</div>

    <div class="status" id="status">
        Checking battery...
    </div>

    <div class="info">
        <p>Charging: <span id="charging">--</span></p>
        <p>Time remaining: <span id="time">--</span></p>
    </div>
</div>

<script>
async function getBatteryInfo() {
    if (!("getBattery" in navigator)) {
        document.getElementById("status").textContent =
            "Battery API not supported on this browser.";
        return;
    }

    try {
        const battery = await navigator.getBattery();

        function updateBattery() {
            const percent = Math.round(battery.level * 100);

            document.getElementById("percentage").textContent =
                percent + "%";

            document.getElementById("level").style.width =
                percent + "%";

            document.getElementById("charging").textContent =
                battery.charging ? "Yes ⚡" : "No";

            document.getElementById("status").textContent =
                battery.charging ? "⚡ Charging" : "On battery";

            document.getElementById("time").textContent =
                battery.charging
                ? (battery.chargingTime === Infinity
                    ? "Unknown"
                    : Math.round(battery.chargingTime / 60) + " min")
                : (battery.dischargingTime === Infinity
                    ? "Unknown"
                    : Math.round(battery.dischargingTime / 60) + " min");

            const color = percent <= 20
                ? "#ef4444"
                : percent <= 50
                ? "#facc15"
                : "#4ade80";

            document.getElementById("level").style.background = color;
        }

        updateBattery();

        battery.addEventListener("levelchange", updateBattery);
        battery.addEventListener("chargingchange", updateBattery);
        battery.addEventListener("chargingtimechange", updateBattery);
        battery.addEventListener("dischargingtimechange", updateBattery);

    } catch (error) {
        document.getElementById("status").textContent =
            "Unable to access battery information.";
    }
}

getBatteryInfo();
</script>

</body>
</html>
